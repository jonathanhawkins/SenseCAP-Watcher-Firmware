dependencies:
  idf: '>=5.4'
  livekit/example_utils:
    version: ~0.2.0
  livekit/livekit:
    version: "0.3.7"
    # Use our LOCAL patched 0.3.7 copy (engine.c teardown-handshake + system.c
    # audio core-pinning live inside it). override_path guarantees the build uses
    # this copy and never silently downloads pristine 0.3.7 from the registry,
    # which would drop those patches. See memory: watcher-livekit-component-dir-trap.
    override_path: "../components/livekit__livekit"
  livekit/sandbox_token:
    version: ~0.1.0
  espressif/esp_codec_dev:
    version: "1.4.0"
  espressif/esp_io_expander: "*"
  esp_io_expander_pca95xx_16bit:
    override_path: "../../../../components/esp_io_expander_pca95xx_16bit"
  espressif/esp_lcd_spd2010: "*"
  espressif/esp_lcd_touch_spd2010: "*"
  esp_lvgl_port:
    override_path: "../../../../components/esp_lvgl_port"
  button:
    version: "3.5.0"
  led_strip: "*"
